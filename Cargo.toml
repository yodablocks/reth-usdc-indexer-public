[package]
name = "reth-usdc-indexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
# Reth (pinned to v1.9.0, same as reth-exex-examples)
reth = { optional = true, git = "https://github.com/paradigmxyz/reth", tag = "v1.9.0" }
reth-exex = { optional = true, git = "https://github.com/paradigmxyz/reth", tag = "v1.9.0", features = ["serde"] }
reth-node-api = { optional = true, git = "https://github.com/paradigmxyz/reth", tag = "v1.9.0" }
reth-node-ethereum = { optional = true, git = "https://github.com/paradigmxyz/reth", tag = "v1.9.0" }
reth-primitives = { optional = true, git = "https://github.com/paradigmxyz/reth", tag = "v1.9.0" }
reth-execution-types = { optional = true, git = "https://github.com/paradigmxyz/reth", tag = "v1.9.0" }
reth-tracing = { optional = true, git = "https://github.com/paradigmxyz/reth", tag = "v1.9.0" }

# Alloy (pinned to match reth-exex-examples)
alloy-primitives = "1.3.1"
alloy-sol-types = "1.3.1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Error handling & logging
eyre = "0.6"
tracing = "0.1"

[features]
# Off by default: building the node binary pulls the full Reth tree.
default = []
exex = ["dep:reth", "dep:reth-exex", "dep:reth-node-api", "dep:reth-node-ethereum", "dep:reth-primitives", "dep:reth-execution-types", "dep:reth-tracing"]

[[bin]]
name = "reth-usdc-indexer"
path = "src/main.rs"
required-features = ["exex"]

[[bin]]
name = "bench-balance"
path = "benches/balance_lookup.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
